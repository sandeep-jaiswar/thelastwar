name: Deterministic Replay Validation
on:
  pull_request:
    branches: [ production ]
  push:
    branches: [ production ]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Run Replay and Recovery Tests
        run: ./gradlew :core:matching:test --tests "*Replay*" --no-daemon
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-test-reports
          path: core/matching/build/reports/tests/
          retention-days: 7

