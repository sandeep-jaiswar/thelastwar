name: Deterministic Replay Validation
on:
  pull_request:
    branches: [ production ]

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Replay Consistency Tests
        run: ./gradlew replayTest
