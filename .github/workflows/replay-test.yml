name: Deterministic Replay Validation
on:
  pull_request:
    branches: [ production ]

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Check if replay tests exist
        id: check_replay
        run: |
          if ./gradlew tasks --all | grep -q "replayTest"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Run Replay Consistency Tests
        if: steps.check_replay.outputs.exists == 'true'
        run: ./gradlew replayTest --no-daemon
      - name: Skip replay tests (not implemented yet)
        if: steps.check_replay.outputs.exists == 'false'
        run: echo "Replay tests not yet implemented - skipping"

