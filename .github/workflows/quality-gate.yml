name: Code Quality Gate
on:
  pull_request:
    branches: [ production ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Coverage & Quality Checks
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew jacocoTestReport sonarqube -Dsonar.qualitygate.wait=true
      - name: Run SonarQube Quality Gate
        run: ./gradlew sonarqube -Dsonar.qualitygate.wait=true
        with:
          distribution: temurin
          java-version: 21
      - name: Run Quality Checks
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew jacocoTestReport sonarqube -Dsonar.qualitygate.wait=true
