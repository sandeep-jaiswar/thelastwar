name: Latency Benchmark Validation
on:
  pull_request:
    branches: [ production ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Run JMH Benchmarks
        run: ./gradlew jmh --no-daemon
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            **/build/reports/benchmarks
            **/jmh-result.json

